name: publish-check
# Refuses material that belongs to the workspace this tree is developed in:
# a pattern over tracked files and commit messages, held in the repository
# secret PUBLISH_CHECK_TERMS (see checks/publish-check.sh).
# Every branch push runs it, not only main: a pull_request run needs the
# merge commit, so a PR with conflicts against main gets no run at all (an
# open target branch sat without a check for two days that way, 2026-10-08
# to 10-10). On a push the base is the previous tip; a new branch or a
# rewritten one (event.before unreachable) is scanned against main, the
# history already checked when it was pushed there.
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: publish-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: publish check
        env:
          PUBLISH_CHECK_TERMS: ${{ secrets.PUBLISH_CHECK_TERMS }}
          PUBLISH_CHECK_ALLOW: ${{ secrets.PUBLISH_CHECK_ALLOW }}
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then base="${{ github.event.before }}"
          elif [ "${{ github.ref_name }}" != main ]; then base="origin/main"; fi
          checks/publish-check.sh "$base"
