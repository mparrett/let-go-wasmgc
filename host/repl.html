<!doctype html>
<!-- A let-go REPL in the browser (round 3 demo): repl.wasm is
     corpus/host/repl.lg compiled by the backend; the page echoes each line
     typed, sends it to the module one key at a time (term/read-key), and
     shows what the module prints. ?module=<url> picks the .wasm
     (default repl.wasm). Serve with host/lg-wasm-host.js beside it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>let-go REPL</title>
<style>
  :root { --bg: #0a0e14; --fg: #d4c5a0; --dim: #6b7280; --in: #9ecbff; --err: #ff6b6b; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-monospace, Menlo, monospace; }
  #status { color: var(--dim); margin-bottom: 8px; }
  #out { margin: 0 0 8px; white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow-y: auto; }
  .in { color: var(--in); }
  .err { color: var(--err); }
  #line { display: flex; gap: 8px; align-items: center; }
  #prompt { color: var(--in); }
  #input { flex: 1; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid var(--dim); font: inherit; outline: none; padding: 4px 0; }
  #hint { color: var(--dim); margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
<div id="status">loading…</div>
<pre id="out"></pre>
<div id="line"><span id="prompt">lg&gt;</span><input id="input" autocomplete="off" spellcheck="false" placeholder="(defn f [x] (* x 2))" disabled></div>
<div id="hint">Up/Down for history. The module keeps state between lines: a defn stays defined.
  Examples: <select id="examples"><option value="">pick one…</option></select></div>
<script type="module">
import { LgWasmHost, hasJSPI } from './lg-wasm-host.js';
const status = document.getElementById('status'), out = document.getElementById('out'), input = document.getElementById('input');
const url = new URLSearchParams(location.search).get('module') || 'repl.wasm';
const history = []; let hi = 0;
// Small, meaningful snippets. Each is one line of forms (several forms are
// fine: the module evaluates them in order and prints the last value). Add
// freely; everything here must use only what the evaluator's core table has.
const EXAMPLES = [
  ['fib', '(defn fib [n] (if (< n 2) n (+ (fib (- n 1)) (fib (- n 2))))) (fib 25)'],
  ['fizzbuzz', '(doseq [i (range 1 16)] (println (cond (zero? (mod i 15)) "FizzBuzz" (zero? (mod i 3)) "Fizz" (zero? (mod i 5)) "Buzz" :else i)))'],
  ['primes', '(defn prime? [k] (and (> k 1) (every? #(pos? (mod k %)) (range 2 k)))) (filter prime? (range 60))'],
  ['factorial of 20 (int64)', '(loop [i 20 acc 1] (if (zero? i) acc (recur (dec i) (* acc i))))'],
  ['lazy for over an infinite range', '(take 5 (for [x (range) :when (odd? x)] (* x x)))'],
  ['iterate', '(take 10 (iterate #(* 2 %) 1))'],
  ['frequencies', '(sort-by val > (frequencies (map str "mississippi")))'],
  ['an atom and a closure', '(def counter (atom 0)) (defn tick! [] (swap! counter inc)) (dotimes [_ 5] (tick!)) @counter'],
  ['destructuring', '(let [{:keys [a b] :or {b 10}} {:a 1} [x & more] [1 2 3]] {:a a :b b :x x :more more})'],
  ['reduce with a map', '(reduce (fn [m w] (update m (count w) (fnil conj []) w)) {} ["a" "bb" "cc" "ddd"])'],
  ['catch an error', '(try (/ 1 0) (catch e (str "caught: " (ex-message e))))'],
  ['string building', '(apply str (interpose "-" (map clojure.string/upper-case ["wasm" "gc" "let-go"])))'],
  ['the namespace you are in', '(do (defn twice [x] (* 2 x)) [(ns-name *ns*) (resolve (quote twice)) (twice 21)])'],
];
const picker = document.getElementById('examples');
for (const [name, code] of EXAMPLES) { const o = document.createElement('option'); o.value = code; o.textContent = name; picker.append(o); }
picker.addEventListener('change', () => { if (picker.value) { input.value = picker.value; input.focus(); } picker.selectedIndex = 0; });
const append = (text, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; out.append(s); out.scrollTop = out.scrollHeight; };
const host = new LgWasmHost({
  // typed text, not game keys: no 16-key cap and no coalescing of repeated
  // keys (D98 would fold "((" into one key), the same as node-host's defaults
  keyCapacity: Infinity, coalesceKeys: false,
  onOutput(text, fd) { append(text, fd === 2 ? 'err' : null); },
});
window.__lgrepl = { stdout: '', done: false };          // what a Playwright check reads back
const origAppend = append;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const line = input.value; input.value = '';
    if (line.trim()) { history.push(line); hi = history.length; }
    append(`lg> ${line}\n`, 'in');
    for (const ch of line) host.sendInput(ch);
    host.sendInput('\n');
  } else if (e.key === 'ArrowUp' && hi > 0) { hi -= 1; input.value = history[hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { hi = Math.min(history.length, hi + 1); input.value = history[hi] ?? ''; e.preventDefault(); }
});
try {
  const t0 = performance.now();
  const bytes = await (await fetch(url)).arrayBuffer();
  status.textContent = `${url} · ${(bytes.byteLength / 1024).toFixed(0)} KB · JSPI ${hasJSPI ? 'yes' : 'NO'}`;
  const done = host.run(bytes);
  // the module's first output (its banner) marks boot: keys sent before the
  // module runs are dropped (as in let-go), so the input opens only then
  const tick = setInterval(() => { if (out.textContent.length) { status.textContent += ` · booted in ${(performance.now() - t0).toFixed(0)} ms`; input.disabled = false; input.focus(); clearInterval(tick); } }, 20);
  const r = await done;
  window.__lgrepl.done = true;
  status.textContent += ` · exit ${r.code}`;
} catch (e) {
  status.textContent += ` · host error: ${String((e && e.message) || e)}`; status.className = 'err';
}
</script>
</body>
</html>
